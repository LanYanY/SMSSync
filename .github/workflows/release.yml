name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: android-client
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsSyncAndroid-debug-apk
          path: android-client/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps and build exe
        shell: powershell
        run: |
          cd windows-client
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1
          pyinstaller -F -n SmsSyncWindows sms_sync_client.py
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsSyncWindows-exe
          path: windows-client/dist/SmsSyncWindows.exe

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/SmsSyncAndroid-debug-apk/app-debug.apk
            out/SmsSyncWindows-exe/SmsSyncWindows.exe
          generate_release_notes: true
